<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 366" width="840" height="366" role="img" aria-label="Максим — backend / infra инженер">
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .fade{opacity:0;animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .type{animation:type .7s steps(8) .3s forwards}
    @keyframes type{to{transform:translateX(90px)}}
    .cursor{opacity:0;animation:blink 1s step-end 5s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .pulse{animation:pulse 2s ease-out 4.8s infinite;transform-origin:624px 340px;opacity:0}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
    .d1{animation-delay:1.1s}.d2{animation-delay:1.9s}.d3{animation-delay:2.4s}
    .d4{animation-delay:2.9s}.d5{animation-delay:3.4s}.d6{animation-delay:3.9s}.d7{animation-delay:4.6s}
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="365" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="420" y="27" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">~/0xraisex — zsh</text>
  <line x1="0" y1="44" x2="840" y2="44" stroke="#21262d"/>

  <!-- $ whoami (typing) -->
  <text x="32" y="78" class="mono" font-size="16"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
  <rect class="type" x="42" y="62" width="90" height="22" fill="#0d1117"/>

  <!-- name -->
  <g class="fade d1">
    <text x="32" y="124" class="sans" font-size="34" font-weight="700" letter-spacing="-0.5"><tspan fill="#f0f6fc">Максим.</tspan><tspan fill="#8b949e"> Backend / Infra инженер.</tspan></text>
  </g>

  <!-- one-liners -->
  <g class="fade d2">
    <rect x="32" y="148" width="92" height="24" rx="12" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-opacity=".5"/>
    <text x="78" y="165" text-anchor="middle" class="mono" font-size="12" fill="#58a6ff">backend</text>
    <text x="140" y="166" class="sans" font-size="17" fill="#e6edf3">Пишу бэкенд на Python: FastAPI, очереди, PostgreSQL.</text>
  </g>
  <g class="fade d3">
    <rect x="32" y="184" width="92" height="24" rx="12" fill="#bc8cff" fill-opacity=".14" stroke="#bc8cff" stroke-opacity=".5"/>
    <text x="78" y="201" text-anchor="middle" class="mono" font-size="12" fill="#bc8cff">platform</text>
    <text x="140" y="202" class="sans" font-size="17" fill="#e6edf3">В одиночку строю свою PaaS: из GitHub в Kubernetes в один клик.</text>
  </g>
  <g class="fade d4">
    <rect x="32" y="220" width="92" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".5"/>
    <text x="78" y="237" text-anchor="middle" class="mono" font-size="12" fill="#3fb950">prod</text>
    <text x="140" y="238" class="sans" font-size="17" fill="#e6edf3">Коммерческий опыт: один поднял систему из 9 сервисов для e-commerce.</text>
  </g>
  <g class="fade d5">
    <rect x="32" y="256" width="92" height="24" rx="12" fill="#ff7b72" fill-opacity=".14" stroke="#ff7b72" stroke-opacity=".5"/>
    <text x="78" y="273" text-anchor="middle" class="mono" font-size="12" fill="#ff7b72">ai agents</text>
    <text x="140" y="274" class="sans" font-size="17" fill="#e6edf3">Веду проекты силами ИИ-агентов и отвечаю за то, чтобы всё работало.</text>
  </g>
  <g class="fade d6">
    <rect x="32" y="292" width="92" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".5"/>
    <text x="78" y="309" text-anchor="middle" class="mono" font-size="12" fill="#d29922">hire me</text>
    <text x="140" y="310" class="sans" font-size="17" fill="#e6edf3">Ищу команду: Backend / Platform / DevOps.</text>
    <rect class="cursor" x="486" y="295" width="9" height="19" fill="#e6edf3"/>
  </g>

  <!-- live status -->
  <g class="fade d7">
    <line x1="0" y1="326" x2="840" y2="326" stroke="#21262d"/>
    <circle class="pulse" cx="624" cy="340" r="5" fill="#3fb950"/>
    <circle cx="624" cy="340" r="5" fill="#3fb950"/>
    <text x="808" y="344.5" text-anchor="end" class="mono" font-size="12" fill="#8b949e">prichal: cluster healthy</text>
    <text x="32" y="344.5" class="mono" font-size="12" fill="#6e7681">Python · FastAPI · Kubernetes · gVisor · Cilium · PostgreSQL · Redis · RabbitMQ</text>
  </g>
</svg>
