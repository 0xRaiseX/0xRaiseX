<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 404" width="840" height="404" role="img" aria-label="Максим — Backend / Infra инженер. Свой PaaS Prichal, коммерческий опыт: AI-инженерия и e-commerce.">
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .fade{opacity:0;animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .blink{animation:b 2s ease-in-out infinite}
    @keyframes b{50%{opacity:.3}}
  </style>
  <rect x="0.5" y="0.5" width="839" height="403" rx="14" fill="#0a0b0d" stroke="#2a2f36"/>

  <!-- top bar -->
  <text x="28" y="40" class="mono" font-size="14" fill="#f0f6fc">0xraisex</text>
  <circle class="blink" cx="489" cy="35" r="4" fill="#3fb950"/>
  <text x="812" y="39.5" text-anchor="end" class="mono" font-size="12" letter-spacing="1.5" fill="#8b949e">ОТКРЫТ К РАБОТЕ · BACKEND / PLATFORM</text>
  <line x1="0" y1="62" x2="840" y2="62" stroke="#1c2026"/>

  <!-- headline -->
  <g class="fade" style="animation-delay:.1s">
    <text x="26" y="124" class="sans" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#f0f6fc">Максим.</text>
  </g>
  <g class="fade" style="animation-delay:.45s">
    <text x="26" y="176" class="sans" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#6e7681">Backend / Infra инженер.</text>
  </g>

  <g class="fade" style="animation-delay:1.00s">
    <line x1="28" y1="210" x2="812" y2="210" stroke="#1c2026"/>
    <text x="28" y="236" class="mono" font-size="12" fill="#484f58">01</text>
    <rect x="58" y="227" width="8" height="8" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="76" y="236" class="mono" font-size="12" letter-spacing="1.5" fill="#58a6ff">BACKEND</text>
    <text x="244" y="236.5" class="sans" font-size="16.5" fill="#e6edf3">Пишу бэкенд на Python: FastAPI, очереди, PostgreSQL.</text>
  </g>
  <g class="fade" style="animation-delay:1.35s">
    <line x1="28" y1="254" x2="812" y2="254" stroke="#1c2026"/>
    <text x="28" y="280" class="mono" font-size="12" fill="#484f58">02</text>
    <rect x="58" y="271" width="8" height="8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="76" y="280" class="mono" font-size="12" letter-spacing="1.5" fill="#3fb950">СВОЯ ПЛАТФОРМА</text>
    <text x="244" y="280.5" class="sans" font-size="16.5" fill="#e6edf3">В одиночку строю PaaS: из GitHub в Kubernetes в один клик.</text>
  </g>
  <g class="fade" style="animation-delay:1.70s">
    <line x1="28" y1="298" x2="812" y2="298" stroke="#1c2026"/>
    <text x="28" y="324" class="mono" font-size="12" fill="#484f58">03</text>
    <rect x="58" y="315" width="8" height="8" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="76" y="324" class="mono" font-size="12" letter-spacing="1.5" fill="#ff7b72">AI-ИНЖЕНЕРИЯ</text>
    <text x="244" y="324.5" class="sans" font-size="16.5" fill="#e6edf3">Работа: управляю командой ИИ-агентов и отвечаю за продукт.</text>
  </g>
  <g class="fade" style="animation-delay:2.05s">
    <line x1="28" y1="342" x2="812" y2="342" stroke="#1c2026"/>
    <text x="28" y="368" class="mono" font-size="12" fill="#484f58">04</text>
    <rect x="58" y="359" width="8" height="8" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <text x="76" y="368" class="mono" font-size="12" letter-spacing="1.5" fill="#d29922">КОММЕРЦИЯ</text>
    <text x="244" y="368.5" class="sans" font-size="16.5" fill="#e6edf3">Один спроектировал и поднял прод из 9 сервисов для e-commerce.</text>
  </g>
  <g class="fade" style="animation-delay:2.6s">
    <line x1="28" y1="386" x2="812" y2="386" stroke="#1c2026"/>
  </g>
</svg>
