<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="840" height="270" role="img" aria-label="AI-инженерия (коммерческая работа): я ставлю задачи и координирую, ИИ-агенты пишут код, тестируют и анализируют, на выходе — работающий продукт">
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .out{animation:out 2.4s linear infinite;opacity:0}
    @keyframes out{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(118px);opacity:0}}
    .o2{animation-delay:.8s}.o3{animation-delay:1.6s}
    .busy{animation:busy 1.2s ease-in-out infinite}
    @keyframes busy{0%,100%{opacity:.25}50%{opacity:1}}
    .b2{animation-delay:.4s}.b3{animation-delay:.8s}
    .ok{animation:ok 2.4s ease-in-out infinite}
    @keyframes ok{0%,100%{fill-opacity:.08}50%{fill-opacity:.22}}
  </style>
  <rect x="0.5" y="0.5" width="839" height="269" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="40" class="sans"><tspan font-size="19" font-weight="700" fill="#e6edf3">AI-инженерия</tspan><tspan dx="12" font-size="15" fill="#8b949e">коммерческая работа · управляемая система ИИ-агентов</tspan></text>

  <!-- me -->
  <rect x="20" y="68" width="190" height="136" rx="10" fill="#161b22" stroke="#ff7b72" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="115" y="100" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#e6edf3">Я</text>
  <g class="sans" font-size="13" fill="#c9d1d9">
    <text x="40" y="130">› ставлю задачи</text>
    <text x="40" y="154">› координирую</text>
    <text x="40" y="178">› отвечаю за результат</text>
  </g>

  <!-- agents -->
  <g class="mono" font-size="13">
    <rect x="330" y="68" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle class="busy" cx="350" cy="88" r="4" fill="#58a6ff"/><text x="364" y="92.5" fill="#e6edf3">agent: код</text>
    <rect x="330" y="116" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle class="busy b2" cx="350" cy="136" r="4" fill="#bc8cff"/><text x="364" y="140.5" fill="#e6edf3">agent: тесты</text>
    <rect x="330" y="164" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle class="busy b3" cx="350" cy="184" r="4" fill="#d29922"/><text x="364" y="188.5" fill="#e6edf3">agent: анализ</text>
  </g>

  <!-- product -->
  <rect class="ok" x="630" y="68" width="190" height="136" rx="10" fill="#3fb950" stroke="#3fb950" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="725" y="128" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#e6edf3">Продукт,</text>
  <text x="725" y="150" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#3fb950">который работает</text>

  <!-- flows -->
  <line x1="212" y1="136" x2="328" y2="136" stroke="#30363d" stroke-width="2"/>
  <line x1="512" y1="136" x2="628" y2="136" stroke="#30363d" stroke-width="2"/>
  <g fill="#ff7b72"><circle class="out" cx="212" cy="136" r="4"/><circle class="out o2" cx="212" cy="136" r="4"/><circle class="out o3" cx="212" cy="136" r="4"/></g>
  <g fill="#3fb950"><circle class="out" cx="512" cy="136" r="4"/><circle class="out o2" cx="512" cy="136" r="4"/><circle class="out o3" cx="512" cy="136" r="4"/></g>

  <text x="420" y="240" text-anchor="middle" class="sans" font-size="15"><tspan fill="#8b949e">Агенты пишут код, тестируют и анализируют — </tspan><tspan fill="#e6edf3" font-weight="700">я отвечаю, чтобы продукт реально работал.</tspan></text>
</svg>
